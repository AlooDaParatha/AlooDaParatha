<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#5CE1E6" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5CE1E6" stop-opacity="0"/>
      <stop offset="1" stop-color="#5CE1E6" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel -->
  <rect width="900" height="240" rx="14" fill="#0D1117"/>
  <rect width="900" height="240" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="14" fill="none" stroke="#5CE1E6" stroke-opacity="0.25"/>

  <!-- Radar -->
  <g filter="url(#glow)" fill="none" stroke="#5CE1E6">
    <circle cx="150" cy="120" r="90" stroke-opacity="0.45"/>
    <circle cx="150" cy="120" r="60" stroke-opacity="0.25"/>
    <circle cx="150" cy="120" r="30" stroke-opacity="0.25"/>
    <line x1="60" y1="120" x2="240" y2="120" stroke-opacity="0.2"/>
    <line x1="150" y1="30" x2="150" y2="210" stroke-opacity="0.2"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 120" to="360 150 120" dur="4s" repeatCount="indefinite"/>
    <path d="M150 120 L150 30 A90 90 0 0 1 213.6 56.4 Z" fill="url(#sweep)"/>
    <line x1="150" y1="120" x2="150" y2="30" stroke="#5CE1E6" stroke-width="2" filter="url(#glow)"/>
  </g>
  <g fill="#E8B04B" filter="url(#glow)">
    <circle cx="190" cy="70" r="3"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="160" r="3"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="178" cy="168" r="3"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="84" r="3"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Hex accents -->
  <g fill="none" stroke="#5CE1E6" stroke-width="1.2" filter="url(#glow)">
    <polygon points="820,26 840,38 840,62 820,74 800,62 800,38"><animate attributeName="stroke-opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></polygon>
    <polygon points="862,60 878,69 878,88 862,97 846,88 846,69" stroke="#E8B04B"><animate attributeName="stroke-opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/></polygon>
  </g>

  <!-- Title block -->
  <text x="300" y="104" font-family="monospace" font-size="46" font-weight="bold" letter-spacing="4" fill="#E6EDF3" filter="url(#glow)">ANSH YADAV</text>
  <rect x="622" y="66" width="20" height="40" fill="#E8B04B">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="300" y="140" font-family="monospace" font-size="15" letter-spacing="3" fill="#E8B04B">&gt; PYTHON  //  JAVASCRIPT  //  OPEN SOURCE</text>
  <text x="300" y="166" font-family="monospace" font-size="13" letter-spacing="1.5" fill="#8B949E">SYS.MODE ... BUILDING COOL THINGS</text>
  <circle cx="306" cy="190" r="4" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="318" y="194" font-family="monospace" font-size="12" letter-spacing="1" fill="#8B949E">ONLINE // LEARNING IN PUBLIC</text>

  <!-- Signal trace -->
  <line x1="300" y1="216" x2="880" y2="216" stroke="#5CE1E6" stroke-opacity="0.15"/>
  <path d="M560 216 L600 216 L614 196 L628 230 L644 180 L658 216 L684 216 L700 204 L712 216 L880 216"
        fill="none" stroke="#5CE1E6" stroke-width="2" stroke-linecap="round" filter="url(#glow)"
        stroke-dasharray="60 20">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- Scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#5CE1E6" fill-opacity="0.3">
    <animate attributeName="y" values="0;238" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
